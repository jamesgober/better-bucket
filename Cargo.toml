[package]
name    = "better-bucket"
version = "1.0.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "A genuinely better token bucket for Rust: lock-free, allocation-free acquire path, cache-aligned, overflow-safe, with a one-line Tier-1 API and a mockable clock for deterministic tests."

# Keywords (5 max)
keywords = [
    "token-bucket",
    "rate-limiting",
    "ratelimit",
    "throttle",
    "backpressure"
]

# Categories
categories = [
    "concurrency",
    "algorithms",
    "no-std"
]

# Links
homepage      = "https://github.com/jamesgober/better-bucket"
repository    = "https://github.com/jamesgober/better-bucket"
documentation = "https://docs.rs/better-bucket"

# Authors
authors = [
    "James Gober <me@jamesgober.com>"
]

[package.metadata.docs.rs]
# The full functional surface is the default features (std + clock); the
# `comparison` feature is benchmark-only and must not pull `governor` into the
# docs build.
features = ["std", "clock"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "better_bucket"
path = "src/lib.rs"

# LINTS
# #################################
# `loom` is a build-time cfg toggled via `RUSTFLAGS="--cfg loom"` for the
# concurrency model-check harness; `docsrs` is set by docs.rs. Registering both
# keeps the `unexpected_cfgs` lint quiet under `-D warnings`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(loom)',
    'cfg(docsrs)',
] }



# FEATURE FLAGS
# #################################
[features]
# Default build: std on, monotonic system clock available.
default = ["std", "clock"]

# Standard library. With it off, the crate is `no_std`: `BucketCore` (the
# caller-driven engine), `BucketConfig`, `BucketBuilder::build_config`,
# `Decision`, and `BucketError` remain, needing only `core` and a 64-bit atomic.
# Propagates std to clock-lib when the `clock` feature is on.
std = ["clock-lib?/std"]

# Pluggable clock source (clock-lib): monotonic time + a mockable clock for
# deterministic, sleep-free tests. On by default. Gates `Bucket<C>`, the
# `TokenBucket` trait, and `BucketBuilder::build`.
#
# `clock` implies `std` because clock-lib's `Clock` trait (and `ManualClock`)
# are themselves std-gated. It also implies `forge`, so a 1.0 consumer building
# with `default-features = false, features = ["clock"]` keeps the `ForgeError`
# impl it had.
clock = ["std", "dep:clock-lib", "forge"]

# `error_forge::ForgeError` for `BucketError`, slotting it into the portfolio
# error stack. Implied by `clock`; a core-only (`no_std`) build does not pull
# error-forge.
forge = ["std", "dep:error-forge"]

# `serde::Serialize` / `Deserialize` for `BucketConfig`. Deserialization runs
# the same validation as `BucketConfig::new`. Off by default; no_std-compatible.
serde = ["dep:serde"]

# Relaxed allowed / denied / granted-token counters on every bucket, read with
# `metrics()`. Off by default; with it off the counters do not exist (no field,
# no atomic increment).
metrics = []

# Use `portable-atomic` for the 64-bit state word. Only needed on targets with
# no native 64-bit atomics (e.g. thumbv7em, 32-bit MIPS/PowerPC); on every other
# target it compiles to the same native instructions. Off by default.
portable-atomic = ["dep:portable-atomic"]

# Benchmark-only: pulls in `governor` for the comparative benchmark
# (`cargo bench --features comparison --bench comparison`). Never enabled in a
# normal build, so it does not affect the crate's dependency footprint or MSRV.
comparison = ["clock", "dep:governor"]



# DEPENDENCIES
# #################################
[dependencies]
# Monotonic time + a mockable clock for deterministic, sleep-free tests. The
# time source the bucket reads on the acquire path; injected so consumers
# (e.g. rate-net) and tests can substitute a ManualClock.
clock-lib = { version = "1.0", optional = true, default-features = false }

# Domain error type metadata (kind/caption) via the portfolio error stack,
# instead of thiserror/anyhow in a library crate. Only the `ForgeError` trait is
# used; `BucketError` is hand-written so every variant is documented. 1.0.2 is
# the floor because it drops the unused thiserror/syn build dependencies.
error-forge = { version = "1.0.2", optional = true }

# Config-file support for `BucketConfig`, behind the `serde` feature. derive
# only, no std, so it works in no_std builds too.
serde = { version = "1.0.200", optional = true, default-features = false, features = ["derive"] }

# 64-bit atomics on targets without them, behind the `portable-atomic` feature.
# `fallback` provides the lock-based implementation where no native 64-bit CAS
# exists; elsewhere the crate is a zero-cost re-export of the native atomics.
portable-atomic = { version = "1.6", optional = true, default-features = false, features = ["fallback"] }

# Benchmark-only incumbent, behind the `comparison` feature. Used solely by the
# `comparison` bench to produce the head-to-head numbers in docs/BENCHMARKS.md.
governor = { version = "0.10", optional = true }



# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion  = { version = "0.5", features = ["html_reports"] }
proptest   = "1"
# Round-trip tests for the `serde` feature.
serde_json = "1"

# `loom` is pulled in only under `cfg(loom)` model-checking builds
# (`RUSTFLAGS="--cfg loom" cargo test`). It is a regular (not dev) dependency
# because the library's atomics switch to `loom::sync::atomic` under that cfg,
# so the lib crate itself — not just the test — must link it.
[target.'cfg(loom)'.dependencies]
loom = "0.7"



# BENCHMARKS
# #################################
# The bench exercises the real `Bucket`, so it needs the clock feature; under a
# bare `no_std` build it is skipped rather than failing to compile.
[[bench]]
name              = "bucket_bench"
harness           = false
required-features = ["clock"]

# Head-to-head vs `governor`. Only built with `--features comparison`.
[[bench]]
name              = "comparison"
harness           = false
required-features = ["comparison"]



# EXAMPLES
# #################################
# `caller_driven` uses only `BucketCore`, so it builds in every configuration;
# the rest drive a `Bucket` and so require the clock feature.
[[example]]
name = "caller_driven"

[[example]]
name              = "per_second"
required-features = ["clock"]

[[example]]
name              = "burst"
required-features = ["clock"]

[[example]]
name              = "deterministic_test"
required-features = ["clock"]

[[example]]
name              = "builder"
required-features = ["clock"]

[[example]]
name              = "admission_control"
required-features = ["clock"]



# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
